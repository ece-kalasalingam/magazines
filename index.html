<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Magazines of ECE Department @ KARE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- jQuery + jQuery UI (needed by flipbook.min.js) -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.9.2/jquery-ui.min.js"></script>

  <!-- Flipbook & icons from Pdf-Flipbook repo -->
  <link rel="stylesheet" type="text/css" href="css/flipbook.style.css" />
  <link rel="stylesheet" type="text/css" href="css/font-awesome.css" />
  <link rel="stylesheet" type="text/css" href="css/footer.css" />
  <link rel="stylesheet" type="text/css" href="css/custom.css" />

  <link rel="shortcut icon" href="images/logo.png" />

  <!-- Flipbook JS (depends on jQuery & jQuery UI above) -->
  <script src="js/pdf.min.js"></script>
  <script src="js/flipbook.min.js"></script>
  <script src="js/pdfThumbnails.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="topbar">
    <div class="topbar-left">
      <img src="images/logo.png" alt="ECE Logo" class="topbar-logo" />
      <div>
        <div class="topbar-title">Electronics and Communication Enginnering Department Magazines</div>
        <div class="topbar-sub">Kalasalingam Academy of Research and Education</div>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="page">
    <div class="page-header">
      <h1>Electrocomm Magazine</h1>
      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="Search by title, year, month..."
        aria-label="Search magazines"
      />
    </div>

    <div id="statusMessage">Loading magazines…</div>

    <section id="magazineGrid" class="grid">
      <!-- Cards injected dynamically -->
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer-simple">
    © <span id="yearSpan"></span> Electronics and Communication Engineering Department – Kalasalingam Academy of Research and Education
  </footer>

  <script>
    // Footer year
    document.getElementById("yearSpan").textContent = new Date().getFullYear();

    var statusEl = document.getElementById("statusMessage");
    var gridEl = document.getElementById("magazineGrid");
    var searchInput = document.getElementById("searchInput");

    var allMagazines = [];
    var filteredMagazines = [];

    function loadMagazines() {
      fetch("data/magazines.json", { cache: "no-cache" })
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function (data) {
          if (!Array.isArray(data)) throw new Error("magazines.json must be an array");
          allMagazines = data;
          filteredMagazines = data.slice().sort(function (a, b) {
            var ya = a.year || 0;
            var yb = b.year || 0;
            if (ya !== yb) return yb - ya;
            return String(b.id || "").localeCompare(String(a.id || ""));
          });
          statusEl.textContent = filteredMagazines.length
            ? filteredMagazines.length + " issue(s) available."
            : "No magazines found.";
          renderMagazines();
        })
        .catch(function (err) {
          console.error(err);
          statusEl.textContent = "Error loading magazines list (data/magazines.json).";
        });
    }

    function renderMagazines() {
      gridEl.innerHTML = "";
      if (!filteredMagazines.length) {
        statusEl.textContent = "No magazines match your search.";
        return;
      }

      filteredMagazines.forEach(function (mag) {
        var card = document.createElement("div");
        card.className = "mag-card mag-item";

        card.dataset.file = mag.file;
        card.dataset.title = mag.title || "";
        card.dataset.year = mag.year || "";
        card.dataset.month = mag.month || "";

        var img = document.createElement("img");
        img.className = "mag-cover";
        img.src = "images/pdf.jpg";
        img.alt = mag.title || "Magazine cover";
	img.width="200";
	img.dataset.pdfThumbnailFile = mag.file;
	img.dataset.pdfThumbnailWidth = "200";
	img.dataset.pdfThumbnailHeight = "200";

        var body = document.createElement("div");
        body.className = "mag-body";

        var titleEl = document.createElement("p");
        titleEl.className = "mag-title";
        titleEl.textContent = mag.title || mag.id || "Magazine";

        var metaEl = document.createElement("p");
        metaEl.className = "mag-meta";
        var year = mag.year ? String(mag.year) : "";
        var month = mag.month || "";
        var size = mag.size || "";
        var metaParts = [];
        if (month || year) metaParts.push([month, year].filter(Boolean).join(" "));
        if (size) metaParts.push(size);
        metaEl.textContent = metaParts.join(" • ");

        var descEl = document.createElement("p");
        descEl.className = "mag-desc";
        descEl.textContent = mag.description || "";

        body.appendChild(titleEl);
        body.appendChild(metaEl);
        if (descEl.textContent) body.appendChild(descEl);

        card.appendChild(img);
        card.appendChild(body);
        gridEl.appendChild(card);
      });

      attachFlipbooks();
      if (typeof createPDFThumbnails === "function") {
	createPDFThumbnails();
      }
    }

    function attachFlipbooks() {
      $(".mag-item").each(function () {
        var $card = $(this);
        var pdfFile = $card.data("file");
        if (!pdfFile) return;

        $card.flipBook({
          pdfUrl: pdfFile,
          lightBox: true,
          viewMode: "3d",
          layout: 3,

          btnPrint: {
            hideOnMobile: true
          },
          btnDownloadPages: {
            enabled: false
          },

          btnColor: "rgb(255,120,60)",
          sideBtnRadius: 60,
          sideBtnSize: 60,
          sideBtnBackground: "rgba(0,0,0,.7)",
          sideBtnColor: "rgb(255,120,60)",
          currentPage: { vAlign: "bottom", hAlign: "left" },
          btnSound: { vAlign: "top", hAlign: "left" },
          btnAutoplay: { vAlign: "top", hAlign: "left" },

          btnShare: {
            enabled: false
          }
        });
      });
    }

    // Search
    searchInput.addEventListener("input", function () {
      var q = (this.value || "").toLowerCase().trim();
      if (!q) {
        filteredMagazines = allMagazines.slice();
      } else {
        filteredMagazines = allMagazines.filter(function (mag) {
          var hay =
            (mag.title || "") +
            " " +
            (mag.month || "") +
            " " +
            (mag.year || "") +
            " " +
            (mag.description || "");
          return hay.toLowerCase().indexOf(q) !== -1;
        });
      }
      renderMagazines();
    });

    document.addEventListener("DOMContentLoaded", loadMagazines);
  </script>
</body>
</html>
